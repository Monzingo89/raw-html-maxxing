name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure capture API
        env:
          RAW_HTML_API_URL: ${{ vars.RAW_HTML_API_URL }}
        run: |
          node -e 'const fs=require("fs"); fs.writeFileSync("public/config.js", `window.RAW_HTML_CONFIG = ${JSON.stringify({apiBaseUrl: process.env.RAW_HTML_API_URL || ""}, null, 2)};\n`)'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
