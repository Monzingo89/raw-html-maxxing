<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Capture the complete rendered HTML for an eBay URL." />
    <meta name="theme-color" content="#f4f1e9" />
    <title>Raw HTML Maxxing</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <form id="fetch-form" novalidate>
        <h1>Enter URL</h1>
        <label class="sr-only" for="url-input">eBay URL</label>
        <textarea
          id="url-input"
          name="url"
          rows="4"
          placeholder="https://www.ebay.com/..."
          spellcheck="false"
          autocapitalize="none"
          autocomplete="url"
          required
        ></textarea>
        <button id="fetch-button" type="submit" disabled>
          <span>Fetch</span>
          <span class="button-indicator" aria-hidden="true"></span>
        </button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
